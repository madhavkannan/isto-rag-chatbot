AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ISTO Personalized Guidance demo (Meridian State University, fictional).
  FALLBACK BRANCH: Cognito + DynamoDB + a combined guardrail/orchestrator
  Lambda behind API Gateway, calling an OpenAI model directly via the
  OpenAI Platform API (chat inference does NOT go through Bedrock on this
  branch — no Bedrock Guardrails layer here; see README.md for why and
  when to use this branch instead of main). Demo modification: no
  OpenSearch/vector knowledge base — policy chunks are keyword-matched
  from a small static list (kb_retrieval.py) instead, the same
  simplification used to verify the Claude-direct branch.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage name, also used in resource naming.

  OpenAIChatModel:
    Type: String
    Default: gpt-5.6-sol
    Description: >
      OpenAI Platform API model id for chat inference, called directly
      (not via Bedrock — see the branch description above). Matches the
      design doc's "GPT-5.6 Sol" reference (the same model main calls via
      Bedrock as openai.gpt-5.6-sol). A cheaper sibling in the same
      family, gpt-5.6-luna, was evaluated and rejected: identical system
      prompt, identical tools, but Luna repeatedly miscounted whether a
      given month/day had already passed relative to "today" — e.g.
      insisting Oct 5 was in the past when today was Aug 30 — which feeds
      directly into the day-by-day compliance math, not just narration.
      Confirm this is a model your OpenAI Platform account actually has
      access to before deploying.

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: >
      OpenAI Platform API key for chat inference on this branch. Stored in
      Secrets Manager, never in code or logs.

  TestUserAPassword:
    Type: String
    NoEcho: true
    Default: MeridianDemo!2026A
    Description: Permanent password for demo Test User A (clean case). Demo only — not production-grade secret handling.

  TestUserBPassword:
    Type: String
    NoEcho: true
    Default: MeridianDemo!2026B
    Description: Permanent password for demo Test User B (needs-attention case). Demo only.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active

Resources:
  # ---------------------------------------------------------------------
  # Identity: Cognito
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub isto-demo-${Stage}
      AutoVerifiedAttributes: []
      UsernameAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub isto-demo-frontend-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 24
      AccessTokenValidity: 24
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours

  # ---------------------------------------------------------------------
  # SIS stand-in: DynamoDB
  # ---------------------------------------------------------------------
  StudentRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub isto-demo-student-records-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: student_id
          AttributeType: S
      KeySchema:
        - AttributeName: student_id
          KeyType: HASH

  # ---------------------------------------------------------------------
  # Secrets Manager: OpenAI credential for direct chat inference
  # ---------------------------------------------------------------------
  OpenAICredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub isto-demo-openai-credentials-${Stage}
      Description: OpenAI Platform API key, used for chat inference.
      SecretString: !Sub '{"OPENAI_API_KEY":"${OpenAIApiKey}"}'

  # ---------------------------------------------------------------------
  # No vector knowledge base on this branch (demo modification) — policy
  # chunks are keyword-matched from a static list bundled in the
  # orchestrator Lambda (kb_retrieval.py). No OpenSearch domain, no
  # separate embeddings call for retrieval.
  # ---------------------------------------------------------------------
  # No Bedrock Guardrails on this branch (chat goes straight to the OpenAI
  # Platform API — see openai_client.py). Story 3's other three defense
  # layers are unaffected: guardrails.py's heuristic pre-filter, the system
  # prompt, and the tool schemas having no student-id parameter.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # API: HTTP API with Cognito JWT authorizer
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - POST
          - OPTIONS
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Combined guardrail + orchestrator Lambda
  # ---------------------------------------------------------------------
  OrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/isto-demo-orchestrator-${Stage}
      RetentionInDays: 30

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub isto-demo-orchestrator-${Stage}
      CodeUri: lambda/orchestrator/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref StudentRecordsTable
          SECRET_ARN: !Ref OpenAICredentialsSecret
          MODEL_ID: !Ref OpenAIChatModel
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StudentRecordsTable
        - Statement:
            - Sid: ReadOpenAISecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref OpenAICredentialsSecret
      Events:
        ChatApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /chat
            Method: POST

  # ---------------------------------------------------------------------
  # Custom resource: seed Cognito test users + DynamoDB test records
  # ---------------------------------------------------------------------
  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/isto-demo-bootstrap-${Stage}
      RetentionInDays: 30

  BootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub isto-demo-bootstrap-${Stage}
      CodeUri: lambda/bootstrap/
      Handler: app.handler
      Timeout: 60
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref StudentRecordsTable
        - Statement:
            - Sid: ManageDemoCognitoUsers
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn

  BootstrapCustomResource:
    Type: Custom::IstoDemoBootstrap
    Properties:
      ServiceToken: !GetAtt BootstrapFunction.Arn
      TableName: !Ref StudentRecordsTable
      UserPoolId: !Ref UserPool
      UserAUsername: usera
      UserAPassword: !Ref TestUserAPassword
      UserARecord:
        # Rule 1 (standing enrollment compliance): C_total >= M and
        # C_inperson >= M-3. Kept separate from the itemized `courses`
        # below, which only need to carry the two courses relevant to the
        # travel/work-hour narratives, not an exhaustive schedule.
        C_total: 15
        C_inperson: 12
        C_online: 3
        M: 12
        # Re-entry signature: expiry is computed (365 days from this date,
        # 182 for OPT) rather than stored flat, per Rule 3.
        travel_signature_date: "2026-06-15"
        visa_status: F1
        academic_calendar:
          - start: "2026-10-05"
            end: "2026-10-09"
            label: Semester Break
        courses:
          - name: Microeconomics 201
            delivery_mode: online
          - name: Data Structures Lab
            delivery_mode: hybrid
            meeting_days: [Tue, Thu]
            # This week's Tuesday session is an async reading module — the
            # Thursday session isn't flagged, so it still requires physical
            # presence.
            remote_session_dates: ["2026-10-13"]
          # Story 2 (course drop / Medical RCL): dropping this brings A to
          # C_total=12/M=12 and C_inperson=9/(M-3)=9 — exactly at both
          # minimums, so the drop is compliant with zero room to spare. No
          # meeting_days/session_dates on purpose — it's irrelevant to the
          # Story 1 travel calendar and should never appear there.
          - name: Statistics 210
            delivery_mode: in_person
            credits: 3
      UserBUsername: userb
      UserBPassword: !Ref TestUserBPassword
      UserBRecord:
        # At both minimums with zero buffer — technically compliant, no
        # slack, fitting their "needs attention" character.
        C_total: 12
        C_inperson: 9
        C_online: 3
        M: 12
        # Unchanged from before: already expired relative to any 2026
        # travel, independent of the attendance check below.
        travel_signature_date: "2025-01-15"
        visa_status: F1
        academic_calendar:
          - start: "2026-10-05"
            end: "2026-10-09"
            label: Semester Break
        courses:
          # Story 2 (course drop / Medical RCL): B is already at both
          # minimums with zero buffer (see C_total/C_inperson above), so
          # dropping this 4-credit in-person course fails BOTH counts —
          # C_total 12->8 (needs 12), C_inperson 9->5 (needs 9). Also the
          # Story 1 travel conflict course, unchanged.
          - name: Organic Chemistry Lecture
            delivery_mode: in_person
            meeting_days: [Wed, Fri]
            credits: 4
            alternative_courses:
              - name: General Chemistry Survey
                delivery_mode: in_person
                credits: 4
              - name: Intro to Biochemistry
                delivery_mode: online
                credits: 4
          - name: Organic Chemistry Lab
            delivery_mode: hybrid
            # Fortnightly — meets on specific dates rather than every week,
            # so an explicit date list, not a weekly recurrence.
            session_dates: ["2026-10-15"]
          - name: Organic Chemistry Recitation
            delivery_mode: hybrid
            meeting_days: [Tue]
            remote_session_dates: ["2026-10-13"]

  # ---------------------------------------------------------------------
  # Frontend hosting: private S3 bucket behind CloudFront (Origin Access
  # Control — no public bucket, no S3 static-website endpoint). Content
  # itself isn't uploaded by CloudFormation; run scripts/deploy_frontend.sh
  # after `sam deploy` to sync the frontend/ folder and generate config.js
  # from this stack's own outputs.
  # ---------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub isto-demo-frontend-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub isto-demo-frontend-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: Base URL for the chat API — POST {ApiUrl}/chat
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TestUserAUsername:
    Value: usera
  TestUserBUsername:
    Value: userb
  Region:
    Value: !Ref AWS::Region
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: Public HTTPS URL for the hosted frontend (run scripts/deploy_frontend.sh first)
    Value: !Sub https://${FrontendDistribution.DomainName}
