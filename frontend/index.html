<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISTO Assistant — Meridian State University (Demo)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" stroke="#2f5d3a" stroke-width="1.5" />
      <path d="M20 9c1.8 3.2 1.8 7.2 0 11-1.8-3.8-1.8-7.8 0-11Z" fill="#2f5d3a" />
      <path d="M31 20c-3.2 1.8-7.2 1.8-11 0 3.8-1.8 7.8-1.8 11 0Z" fill="#2f5d3a" />
      <path d="M20 31c-1.8-3.2-1.8-7.2 0-11 1.8 3.8 1.8 7.8 0 11Z" fill="#2f5d3a" />
      <path d="M9 20c3.2-1.8 7.2-1.8 11 0-3.8 1.8-7.8 1.8-11 0Z" fill="#2f5d3a" />
      <circle cx="20" cy="20" r="3.2" fill="#2f5d3a" />
    </svg>
    <div>
      <h1>ISTO Assistant</h1>
      <p>Meridian State University · Fictional demo</p>
    </div>
  </header>

  <main>
    <div id="error-banner" class="hidden"></div>

    <section id="login-panel">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to ask about travel endorsements, dropping a class, or general policy questions.</p>

      <label for="user-select">Sign in as</label>
      <select id="user-select">
        <option value="usera">Test User A — clean case</option>
        <option value="userb">Test User B — needs attention</option>
      </select>

      <label for="password-input">Password</label>
      <input id="password-input" type="password" />

      <button id="login-btn">Sign in</button>
    </section>

    <section id="chat-panel" class="hidden">
      <div id="session-bar">
        <span id="session-label"></span>
        <button id="logout-btn">Sign out</button>
      </div>
      <div id="chat-window"></div>
      <div id="starter-prompts">
        <button type="button" class="starter-chip" data-prompt="Can I travel home for the holidays?">Can I travel home for the holidays?</button>
        <button type="button" class="starter-chip" data-prompt="I'd like to drop one of my classes.">I'd like to drop one of my classes.</button>
        <button type="button" class="starter-chip" data-prompt="I've been doing full-time CPT for 10 months — can I still do OPT after I graduate?">I've been doing full-time CPT for 10 months — can I still do OPT after I graduate?</button>
      </div>
      <form id="composer">
        <input id="message-input" type="text" placeholder="Ask ISTO a question…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
